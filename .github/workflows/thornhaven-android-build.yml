name: Thornhaven Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/thornhaven-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact audited game payload
        run: python3 tools/restore-game-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source and regression tests
        run: |
          python3 tools/verify.py
          for test in tools/*checks.cjs; do node "$test"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: |
          test -f app/build.gradle || { echo 'Android project not uploaded yet'; exit 1; }
          gradle --no-daemon :app:lintDebug :app:assembleDebug
      - name: Verify APK identity and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='158' versionName='1.0.56-dev'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: thornhaven-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
