name: Thornhaven Android APK
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      # Release documentation is validated against signed package hashes/source.
      - 'README.md'
      - 'BUILD-WORKFLOW.md'
      - 'THORNHAVEN_CONTINUITY.md'
      - 'build-signed-release.py'
      - 'build-play-bundle.py'
      - 'app/**'
      - 'source-payload/**'
      - 'tools/**'
      - 'index.html'
      - 'scripts/**'
      - 'gradle/**'
      - 'gradlew'
      - 'settings.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/thornhaven-android-build.yml'
      - '.github/workflows/thornhaven-release.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore hash-verified Thornhaven game source
        run: |
          python3 tools/restore-game-source.py
          python3 tools/restore-1.0.69.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Alabama-inspired atlas integration
        run: node scripts/test-atlas-geography.cjs
      - name: Install FFmpeg for native-rate audio validation
        if: ${{ hashFiles('tools/audio-assets-checks.cjs') != '' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version
      - name: Verify source and regression tests
        run: |
          python3 tools/verify-release-candidate-169.py
          python3 tools/verify.py
          python3 tools/test-release-instructions.py
          python3 tools/test-android-upgrade-preflight.py
          python3 tools/test-offline-signing.py
          python3 tools/test-play-bundle-signing.py
          python3 tools/test-aab-manifest-identity.py
          python3 tools/test-android-billing-manifest.py
          python3 tools/test-bug-report-version.py
          python3 tools/test-release-native-parity.py
          python3 tools/test_atomic_release_publish.py
          python3 tools/test-ci-artifact-extraction.py
          python3 tools/test-release-payload-duplicates.py
          for test in tools/*checks.cjs; do node "$test"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chromium interactive gameplay and world-map smoke (QA only)
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.57.0
          python3 tools/browser-interactive-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-interactive-qa
          python3 tools/browser-camp-story-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-camp-story-qa
          python3 tools/browser-gathering-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-gathering-qa
          python3 tools/browser-pet-combat-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-pet-combat-qa
          python3 tools/browser-joystick-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-joystick-qa
          python3 tools/browser-last-lantern-qa.py
          python3 tools/browser-audio-qa.py
          python3 tools/browser-audio-media-qa.py
          python3 tools/browser-voice-qa.py
          python3 tools/browser-veil-counsel-qa.py
          python3 tools/browser-road-inquiry-qa.py
          python3 tools/browser-early-quest-choices-qa.py
          python3 tools/browser-ashvale-quest-choices-qa.py
          python3 tools/browser-brackenford-quest-choices-qa.py
          python3 tools/browser-sunmere-quest-choices-qa.py
          python3 tools/browser-stonewatch-quest-choices-qa.py
          # Run each orientation in its own Chromium process to bound 26-MB HTML memory.
          python3 tools/browser-purchase-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-purchase-qa --orientation portrait
          python3 tools/browser-purchase-qa.py --assets app/src/main/assets \
            --evidence-dir reports/browser-purchase-qa --orientation landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thornhaven-browser-interactive-qa
          path: |
            reports/browser-interactive-qa/*.png
            reports/browser-camp-story-qa/*.png
            reports/browser-gathering-qa/*.png
            reports/browser-pet-combat-qa/*.png
            reports/browser-joystick-qa/*.png
            reports/early-quest-choices/*.png
            reports/early-quest-choices/results.json
            reports/ashvale-quest-choices/*.png
            reports/ashvale-quest-choices/results.json
            reports/brackenford-quest-choices/*.png
            reports/brackenford-quest-choices/results.json
            reports/sunmere-quest-choices/*.png
            reports/sunmere-quest-choices/results.json
            reports/stonewatch-quest-choices/*.png
            reports/stonewatch-quest-choices/results.json
            reports/last-lantern/*.png
            reports/last-lantern/results.json
            reports/veil-counsel/*.png
            reports/veil-counsel/results.json
            reports/road-inquiry/*.png
            reports/road-inquiry/results.json
            reports/browser-purchase-qa/*.png
          if-no-files-found: ignore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify privileged WebView stays on trusted game page
        run: |
          set -eu
          TEST_CLASSES="$(mktemp -d)"
          trap 'rm -rf "$TEST_CLASSES"' EXIT
          javac -d "$TEST_CLASSES" \
            app/src/main/java/com/emberfall/ashvale/TrustedGameNavigation.java \
            tools/TrustedGameNavigationTest.java
          java -cp "$TEST_CLASSES" com.emberfall.ashvale.TrustedGameNavigationTest
      - name: Verify native Google Play purchase signature gate
        run: |
          set -eu
          TEST_CLASSES="$(mktemp -d)"
          trap 'rm -rf "$TEST_CLASSES"' EXIT
          # Compile the same source file used by the app, not a mock verifier.
          grep -q 'BillingSignature.verify(' app/src/main/java/com/emberfall/ashvale/PlayBillingPreparation.java
          javac -d "$TEST_CLASSES" \
            app/src/main/java/com/emberfall/ashvale/BillingSignature.java \
            tools/BillingSignatureTest.java
          java -cp "$TEST_CLASSES" com.emberfall.ashvale.BillingSignatureTest
      - name: Verify native Cloud Save document round-trip handling
        run: |
          set -eu
          TEST_CLASSES="$(mktemp -d)"
          trap 'rm -rf "$TEST_CLASSES"' EXIT
          javac -d "$TEST_CLASSES" \
            app/src/main/java/com/emberfall/ashvale/BackupDocumentIntegrity.java \
            tools/BackupDocumentIntegrityTest.java
          java -cp "$TEST_CLASSES" com.emberfall.ashvale.BackupDocumentIntegrityTest
      - name: Verify Play Billing receipt completion after persistence errors
        run: node tools/native-billing-completion-test.cjs
      - name: Verify Play Billing delivery does not survive failed local receipt commits
        run: node tools/native-billing-delivery-test.cjs
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: |
          test -f app/build.gradle || { echo 'Android project not uploaded yet'; exit 1; }
          gradle --no-daemon :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease
      # Test the exact game HTML packaged into the compiled Android release,
      # not merely the restored source tree. A packaging divergence must fail CI.
      - name: Browser-test compiled Android release APK assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          compiled_dir="$RUNNER_TEMP/thornhaven-compiled-browser"
          mkdir -p "$compiled_dir"
          unzip -qq "$apk" 'assets/*' -d "$compiled_dir"
          python3 tools/browser-interactive-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-release-qa
          # Preserve camp story, real edge-travel and early-game resource progression in the APK itself.
          # Source-only browser QA cannot detect an outdated packaged HTML or companion script.
          python3 tools/browser-camp-story-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-camp-story-qa
          python3 tools/browser-gathering-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-gathering-qa
          # Test the packaged pet-combat and purchase flows, not only restored source.
          # Each orientation launches its own browser to bound game HTML memory.
          python3 tools/browser-pet-combat-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-pet-combat-qa
          python3 tools/browser-purchase-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-purchase-qa --orientation portrait
          python3 tools/browser-purchase-qa.py --assets "$compiled_dir/assets" --evidence-dir reports/browser-compiled-purchase-qa --orientation landscape
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thornhaven-1.0.70-compiled-release-browser-qa
          path: |
            reports/browser-compiled-release-qa/*.png
            reports/browser-compiled-camp-story-qa/*.png
            reports/browser-compiled-gathering-qa/*.png
            reports/browser-compiled-pet-combat-qa/*.png
            reports/browser-compiled-purchase-qa/*.png
          if-no-files-found: ignore

      - name: Verify APK identity and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='172' versionName='1.0.70'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: thornhaven-1.0.70-debug-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Verify compiled release Billing manifest and installation identity
        run: |
          python3 tools/check-android-billing-manifest.py \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --version-code 172
      - name: Verify release payload asset and save-origin compatibility
        run: |
          python3 tools/release-payload-checks.py \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --assets app/src/main/assets \
            --gradle app/build.gradle \
            --activity app/src/main/java/com/emberfall/ashvale/MainActivity.java \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - name: Verify offline NPC speech bridge is present in compiled APK and AAB
        run: |
          python3 tools/compiled-audio-release-checks.py
          python3 tools/compiled-npc-voice-payload-check.py \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --assets app/src/main/assets
      - name: Validate Google Play bundle format and QA-generated universal APK
        shell: bash
        run: |
          set -euo pipefail
          # This is offline bundletool compatibility QA, NOT Play Console acceptance.
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$aab"
          tool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl -fL --retry 3 --silent --show-error \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -o "$tool"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$tool" | sha256sum -c -
          java -jar "$tool" validate --bundle="$aab"
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/@package)" = 'com.vaelbrink.ashvale.newjourney'
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)" = '172'
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionName)" = '1.0.70'
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/uses-sdk/@android:targetSdkVersion)" = '36'
          # Disposable QA signing for bundletool's generated APK. Never distribute it.
          qa_key="$RUNNER_TEMP/thornhaven-bundletool-qa.p12"
          qa_set="$RUNNER_TEMP/thornhaven-bundletool-qa.apks"
          qa_apk="$RUNNER_TEMP/thornhaven-bundletool-universal-qa.apk"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$qa_key" -alias qa-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Thornhaven Disposable Bundletool QA' \
            -storepass throwawayqa123 -keypass throwawayqa123
          java -jar "$tool" build-apks --bundle="$aab" --output="$qa_set" \
            --mode=universal --ks="$qa_key" --ks-key-alias=qa-only \
            --ks-pass=pass:throwawayqa123 --key-pass=pass:throwawayqa123
          unzip -p "$qa_set" universal.apk > "$qa_apk"
          test -s "$qa_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$qa_apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$qa_apk" | \
            grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='172' versionName='1.0.70'"
          cmp <(unzip -p "$aab" base/assets/index.html) <(unzip -p "$qa_apk" assets/index.html)
          rm -f "$qa_key" "$qa_set" "$qa_apk" "$tool"
          echo 'PASS: bundletool 1.18.3 validated the AAB and generated a matching QA-signed universal APK. NOT a Play-delivered update.'
      - name: Stage unsigned release outputs and Android signing utilities
        run: |
          set -eu
          mkdir -p release-payload/tools/lib
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-payload/
          cp app/build/outputs/bundle/release/app-release.aab release-payload/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" release-payload/tools/zipalign
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" release-payload/tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-payload/tools/lib/apksigner.jar
          mkdir -p release-payload/tools/lib64
          cp "$ANDROID_HOME/build-tools/36.0.0/lib64/libc++.so" release-payload/tools/lib64/libc++.so
          cp "$ANDROID_HOME/build-tools/36.0.0/aapt" release-payload/tools/aapt
          chmod +x release-payload/tools/zipalign release-payload/tools/apksigner
          echo "Release outputs are UNSIGNED. Never install or distribute as a Play update."
      - uses: actions/upload-artifact@v4
        with:
          name: thornhaven-1.0.70-UNSIGNED-release-payload
          path: release-payload/
          if-no-files-found: error
          retention-days: 7
