name: Thornhaven 1.0.57 maintained-key AAB
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited game and check release identity
        run: |
          python3 tools/restore-game-source.py
          grep -q "versionCode 159" app/build.gradle
          grep -q "versionName '1.0.57'" app/build.gradle
          grep -q "THORNHAVEN_157_GEAR_BEGIN" app/src/main/assets/playtest-update.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source, gameplay and save regression suites
        run: |
          python3 tools/verify.py
          for test in tools/*checks.cjs; do node "$test"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify maintained release-key secrets
        env:
          KEYSTORE_B64: ${{ secrets.THORNHAVEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.THORNHAVEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THORNHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THORNHAVEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Maintained release-signing secrets unavailable"; exit 1; }
          mkdir -p "$RUNNER_TEMP/thornhaven-signing"
          chmod 700 "$RUNNER_TEMP/thornhaven-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/thornhaven-signing/maintained.jks"
          chmod 600 "$RUNNER_TEMP/thornhaven-signing/maintained.jks"
          actual=$(keytool -exportcert -keystore "$RUNNER_TEMP/thornhaven-signing/maintained.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)
          expected=38dc061e50f36b8eaeab5a582f8519d93a2ec9b5c256409219744351097cdd22
          test "$actual" = "$expected" || { echo "Maintained release-signing certificate mismatch"; exit 1; }
          echo "Release signing certificate fingerprint verified."
      - name: Build, sign and verify release APK and AAB
        env:
          STORE_PASSWORD: ${{ secrets.THORNHAVEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THORNHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THORNHAVEN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease :app:bundleRelease
          mkdir -p release-output
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          aligned=release-output/thornhaven-1.0.57-aligned-unsigned.apk
          apk=release-output/Thornhaven-1.0.57-maintained-key.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          test -s "$unsigned" && test -s "$aab"
          zipalign -f -p 4 "$unsigned" "$aligned"
          apksigner sign --ks "$RUNNER_TEMP/thornhaven-signing/maintained.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --v2-signing-enabled true --v3-signing-enabled true --out "$apk" "$aligned"
          rm "$aligned"
          zipalign -c -p 4 "$apk"
          apksigner verify --verbose --print-certs "$apk" | tee release-output/apk-signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' release-output/apk-signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' release-output/apk-signature.txt
          grep -qi '38dc061e50f36b8eaeab5a582f8519d93a2ec9b5c256409219744351097cdd22' release-output/apk-signature.txt
          aapt dump badging "$apk" | tee release-output/apk-badging.txt
          grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='159' versionName='1.0.57'" release-output/apk-badging.txt
          unzip -t "$apk" >/dev/null
          unzip -p "$apk" assets/playtest-update.js | grep -q THORNHAVEN_157_GEAR_BEGIN
          jarsigner -keystore "$RUNNER_TEMP/thornhaven-signing/maintained.jks" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD "$aab" "$KEY_ALIAS"
          jarsigner -verify "$aab" | grep -q 'jar verified'
          unzip -t "$aab" >/dev/null
          unzip -p "$aab" base/assets/playtest-update.js | grep -q THORNHAVEN_157_GEAR_BEGIN
          cp "$aab" release-output/Thornhaven-1.0.57-maintained-key.aab
          sha256sum "$apk" release-output/Thornhaven-1.0.57-maintained-key.aab | tee release-output/SHA256SUMS.txt
          echo 'Signed release artifacts verified; NOT delivered through Google Play.'
      - uses: actions/upload-artifact@v4
        with:
          name: Thornhaven-1.0.57-maintained-signed-release
          path: |
            release-output/Thornhaven-1.0.57-maintained-key.apk
            release-output/Thornhaven-1.0.57-maintained-key.aab
            release-output/SHA256SUMS.txt
            release-output/apk-signature.txt
            release-output/apk-badging.txt
          if-no-files-found: error
          retention-days: 14
