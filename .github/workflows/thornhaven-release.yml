name: Thornhaven release build (source kit)
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify private inputs
        env:
          KIT_URL: ${{ secrets.THORNHAVEN_BUILD_KIT_URL }}
          KEYSTORE_B64: ${{ secrets.THORNHAVEN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THORNHAVEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THORNHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THORNHAVEN_KEY_PASSWORD }}
        run: |
          test -n "$KIT_URL" && test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Required private source/signing secrets missing"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch private 1.0.55 build kit
        env:
          KIT_URL: ${{ secrets.THORNHAVEN_BUILD_KIT_URL }}
        run: |
          curl --fail --location --silent --show-error "$KIT_URL" -o kit.zip
          unzip -q kit.zip
          test -f thornhaven/app/build.gradle
          grep -q "applicationId 'com.vaelbrink.ashvale.newjourney'" thornhaven/app/build.gradle
          grep -q "versionName '1.0.55'" thornhaven/app/build.gradle
      - name: Restore established signing key
        env:
          KEYSTORE_B64: ${{ secrets.THORNHAVEN_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/vaelbrink-maintained.jks"
      - name: Build Android App Bundle
        working-directory: thornhaven
        env:
          STORE_FILE: ${{ runner.temp }}/signing/vaelbrink-maintained.jks
          STORE_PASSWORD: ${{ secrets.THORNHAVEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THORNHAVEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THORNHAVEN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bundleRelease
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -keystore "$STORE_FILE" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
      - uses: actions/upload-artifact@v4
        with:
          name: thornhaven-1.0.55-signed-aab
          path: thornhaven/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
