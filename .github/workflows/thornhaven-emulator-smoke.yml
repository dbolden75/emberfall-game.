name: Thornhaven Android emulator smoke
on:
  workflow_dispatch:
  # Run Android WebView/save-upgrade regressions on main source changes
  # and on targeted QA branches. This never accesses a release keystore.
  push:
    branches:
      - main
      - qa/release-variant-upgrade-saves-20261029
      - qa/164-android-background-save-20261030
      - qa/164-true-town-edge-entry-20261030
      - qa/164-android-joystick-drag-20261030
      - qa/164-android-portrait-landscape-controls-20261030
      - qa/164-options-joystick-control-side-20261030
      - fix/164-left-touch-actions-20261030
      - qa/164-independent-control-matrix-20261030
      - fix/fog-refresh-party-portraits-20261028
      - qa/164-release-apk-emulator-smoke-20261029
      - qa/164-aab-universal-emulator-20261030
      - ci/aab-install-preserves-android-package-state-20261031
      - fix/emulator-launch-watchdog-20261029
      - fix/164-legacy-enemy-coordinates-20261028
      - fix/164-legacy-equipment-summary-20261028
      - fix/164-legacy-bag-capacity-20261028
      - qa/163-multislot-upgrade
      - fix/163-native-save-backups
      - qa/163-cloud-document-picker
      - qa/163-cloud-save-roundtrip
      - qa/163-cloud-save-confirmed-restore
      - qa/163-android-emulator-smoke
      - qa/163-interactive-emulator-smoke
      - qa/163-native-upgrade-probe
      - qa/163-render-stress
      - qa/163-historical-157-upgrade
      - qa/166-android16-native-controls-20261031
      - qa/166-android14-portrait-side-isolation-20261031
      - qa/166-stream-native-logcat-on-emulator-loss-20261031
      - qa/166-api34-landscape-isolation-main-20261031
      - fix/cloud-save-io-callback-sequencing
      - fix/billing-refresh-stale-callbacks-20261101
      - fix/billing-finish-retry-session-20261101
    paths:
      - 'app/**'
      - 'source-payload/**'
      - 'tools/restore-game-source.py'
      - '.github/workflows/thornhaven-emulator-smoke.yml'
      - 'tools/emulator-smoke.sh'
      - 'tools/emulator-save-upgrade.sh'
      - 'tools/emulator-release-qa.sh'
      - 'tools/emulator-aab-install-qa.sh'
      - 'tools/emulator-control-matrix-qa.sh'
      - 'tools/emulator-matrix-checks.cjs'
      - 'tools/emulator-webview-probe.cjs'
      - 'tools/emulator-document-picker.py'
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited game HTML
        run: python3 tools/restore-game-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Syntax-check native WebView QA inspector
        run: node --check tools/emulator-webview-probe.cjs
      - name: Checkout immutable historical Thornhaven 1.0.57 source
        uses: actions/checkout@v4
        with:
          # Audited 1.0.57 release source: package same, versionCode 159.
          ref: ec7236466c7efa494826c584f95fa61f236ec8ca
          path: qa-historical-157
          persist-credentials: false
      - name: Build historical 1.0.57 and current 1.0.64 debug APKs
        run: |
          set -euo pipefail
          # Prove that the older HTML is the independently archived 1.0.57
          # gameplay payload. No new release signing material is used.
          python3 qa-historical-157/tools/restore-game-source.py
          printf '%s  %s\n' '9e266784b17b65fcd11303f742e2d7f9fb91c727f2a3a1d7ebb6dd7e8d3c0e4f' 'qa-historical-157/app/src/main/assets/index.html' | sha256sum -c -
          grep -q 'versionCode 159' qa-historical-157/app/build.gradle
          grep -q "versionName '1.0.57'" qa-historical-157/app/build.gradle
          printf '%s  %s\n' '237f0f74e47f87fe8f88f54efc4d1d0f1d3779ded3c6b5575ee6bcefd9f95b92' 'app/src/main/assets/index.html' | sha256sum -c -
          grep -q 'versionCode 166' app/build.gradle
          grep -q "versionName '1.0.64'" app/build.gradle
          # Keep a byte-exact copy of the uninstrumented production-variant
          # AAB before enabling the temporary WebView debugger for synthetic
          # save tests. Only the disposable QA-derived APK will be installed.
          grep -q 'WebView.setWebContentsDebuggingEnabled(false);' app/src/main/java/com/emberfall/ashvale/MainActivity.java
          gradle --no-daemon :app:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/thornhaven-uninstrumented-release.aab"
          test -s "$RUNNER_TEMP/thornhaven-uninstrumented-release.aab"
          # Debug inspection exists only on the disposable emulator runner.
          # Neither production MainActivity is edited in Git or published.
          python3 - <<'PY'
          from pathlib import Path
          for project in ('qa-historical-157', '.'):
              p = Path(project) / 'app/src/main/java/com/emberfall/ashvale/MainActivity.java'
              old = 'WebView.setWebContentsDebuggingEnabled(false);'
              original = p.read_text()
              assert original.count(old) == 1, 'WebView debug toggle changed in ' + project
              p.write_text(original.replace(old, 'WebView.setWebContentsDebuggingEnabled(true);'))
          PY
          (cd qa-historical-157 && gradle --no-daemon :app:assembleDebug :app:assembleRelease)
          gradle --no-daemon :app:assembleDebug :app:assembleRelease
          echo 'Built audited 1.0.57 DEBUG/RELEASE and 1.0.64 DEBUG/RELEASE; no maintained signing credentials used.'
      - name: Sign historical and current RELEASE APKs with the SAME disposable QA key
        run: |
          set -euo pipefail
          # This ephemeral key is NOT the original maintained release/upload key.
          # QA APKs are deleted with the runner and must never be distributed.
          keystore="$RUNNER_TEMP/thornhaven-disposable-qa.p12"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -alias qa-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Thornhaven Disposable Emulator QA' \
            -keystore "$keystore" -storepass throwawayqa123 -keypass throwawayqa123
          sign_qa () {
            local unsigned="$1" apk="$2" code="$3" name="$4"
            local aligned="$RUNNER_TEMP/qa-release-$code-aligned.apk"
            local report="$RUNNER_TEMP/qa-release-$code-signature.txt"
            test -s "$unsigned"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$keystore" --ks-key-alias qa-only \
              --ks-pass pass:throwawayqa123 --key-pass pass:throwawayqa123 \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "$apk" "$aligned"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > "$report"
            grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report"
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$report"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='$code' versionName='$name'"
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$report" | head -n 1 > "$RUNNER_TEMP/qa-release-$code-cert"
            test -s "$RUNNER_TEMP/qa-release-$code-cert"
            rm -f "$aligned"
          }
          sign_qa qa-historical-157/app/build/outputs/apk/release/app-release-unsigned.apk \
            qa-historical-157/app/build/outputs/apk/release/thornhaven-ephemeral-historical-release-QA.apk 159 1.0.57
          sign_qa app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/thornhaven-ephemeral-release-QA.apk 166 1.0.64
          cmp "$RUNNER_TEMP/qa-release-159-cert" "$RUNNER_TEMP/qa-release-166-cert"
          ! grep -q '38dc061e50f36b8eaeab5a582f8519d93a2ec9b5c256409219744351097cdd22' "$RUNNER_TEMP/qa-release-166-cert"
          # Google Play installs APKs generated from an AAB, rather than
          # copying our directly signed standalone release APK. Add a real
          # emulator install smoke for that conversion without private keys.
          aab="$RUNNER_TEMP/thornhaven-uninstrumented-release.aab"
          tool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl -fL --retry 3 --silent --show-error \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' -o "$tool"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$tool" | sha256sum -c -
          java -jar "$tool" validate --bundle="$aab"
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/@package)" = 'com.vaelbrink.ashvale.newjourney'
          test "$(java -jar "$tool" dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)" = '166'
          apks="$RUNNER_TEMP/thornhaven-aab-install-qa.apks"
          universal="$RUNNER_TEMP/thornhaven-aab-install-qa.apk"
          java -jar "$tool" build-apks --bundle="$aab" --output="$apks" \
            --mode=universal --ks="$keystore" --ks-key-alias=qa-only \
            --ks-pass=pass:throwawayqa123 --key-pass=pass:throwawayqa123
          unzip -p "$apks" universal.apk > "$universal"
          test -s "$universal"
          mkdir -p reports/emulator
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$universal" > reports/emulator/qa-aab-universal-signer.txt
          universal_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' reports/emulator/qa-aab-universal-signer.txt | head -n 1)"
          test -n "$universal_cert"
          test "$universal_cert" = "$(cat "$RUNNER_TEMP/qa-release-166-cert")" || { echo 'AAB-universal QA signer differs from synthetic release-QA signer'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$universal" | grep -q "package: name='com.vaelbrink.ashvale.newjourney' versionCode='166' versionName='1.0.64'"
          cmp <(unzip -p "$aab" base/assets/index.html) <(unzip -p "$universal" assets/index.html)
          sha256sum "$aab" "$universal" > reports/emulator/qa-aab-universal-hashes.txt
          rm -f "$keystore" "$tool" "$apks"
          echo 'PASS: clean production AAB generated a disposable QA-signed universal APK with the same temporary key as the emulator release fixture.'
          echo 'PASS: disposable 1.0.57 and 1.0.64 RELEASE APKs share one QA signer, distinct from the maintained original. Neither APK will be published.'
      - name: Release build daemons before booting memory-heavy emulator
        run: |
          gradle --stop || true
          free -m
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Install, start and restart APK in disposable Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Pin to stable Android Emulator 36.3.10 (build 14472402), rather
          # than rolling 37.2.13 which repeatedly crashes host GPU/ADB.
          emulator-build: 14472402
          arch: x86_64
          profile: pixel_5
          # Trial 3 GiB guest: API34 WebView/ADB disconnected even after portrait
          # handedness isolation; failed-run evidence showed 14.7 GiB host RAM
          # available, so eliminate guest memory pressure as a confounder.
          ram-size: 3072M
          heap-size: 256M
          cores: 2
          disable-animations: true
          # Use the Android emulator runner's documented SwiftShader indirect mode,
          # which has better Chromium/WebView compatibility than -gpu swiftshader.
          # Continue disabling guest Vulkan to isolate hosted graphics issues.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator-smoke.sh && bash tools/emulator-save-upgrade.sh && bash tools/emulator-release-qa.sh && bash tools/emulator-aab-install-qa.sh
      - name: Preserve smoke-test screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thornhaven-164-android-emulator-smoke-evidence
          path: reports/emulator/
          if-no-files-found: ignore
          retention-days: 7

  # Fresh emulator: verify actual native orientation/preferences independently
  # of the long release-upgrade + Android document-provider stress scenario.
  # The same game HTML is verified, but this job never touches production keys.
  control-matrix:
    # Verify all controls on both Android 14 and Android 16 (target SDK 36).
    # Combined matrix covers the original eight cases with every assertion.
    strategy:
      fail-fast: false
      matrix:
        orientation: [portrait, landscape]
        api-level: [34, 36]
        side: [both]
        # Android 14 portrait and landscape combined-side runs have
        # intermittently lost the hosted emulator during WebView settings
        # transitions; isolate handedness in fresh disposable instances.
        exclude:
          - orientation: portrait
            api-level: 34
            side: both
          - orientation: landscape
            api-level: 34
            side: both
        include:
          - orientation: portrait
            api-level: 34
            side: right
          - orientation: portrait
            api-level: 34
            side: left
          - orientation: landscape
            api-level: 34
            side: right
          - orientation: landscape
            api-level: 34
            side: left
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited 1.0.64 game HTML
        run: |
          python3 tools/restore-game-source.py
          printf '%s  %s\n' '237f0f74e47f87fe8f88f54efc4d1d0f1d3779ded3c6b5575ee6bcefd9f95b92' 'app/src/main/assets/index.html' | sha256sum -c -
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build disposable debug-inspectable APK (never distribute)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/emberfall/ashvale/MainActivity.java')
          s=p.read_text()
          old='WebView.setWebContentsDebuggingEnabled(false);'
          assert s.count(old)==1, 'Production WebView debugger policy changed'
          p.write_text(s.replace(old,'WebView.setWebContentsDebuggingEnabled(true);'))
          PY
          node --check tools/emulator-webview-probe.cjs
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          gradle --stop || true
      - name: Enable KVM for hosted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Test native control preferences on Android 14 and 16 emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # Pin to stable Android Emulator 36.3.10 (build 14472402), rather
          # than rolling 37.2.13 which repeatedly crashes host GPU/ADB.
          emulator-build: 14472402
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          heap-size: 256M
          cores: 2
          disable-animations: true
          # Use the Android emulator runner's documented SwiftShader indirect mode,
          # which has better Chromium/WebView compatibility than -gpu swiftshader.
          # Continue disabling guest Vulkan to isolate hosted graphics issues.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          script: bash tools/emulator-control-matrix-qa.sh ${{ matrix.orientation }} ${{ matrix.side }}
      - name: Upload independent control matrix and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thornhaven-164-android-api${{ matrix.api-level }}-${{ matrix.orientation }}-${{ matrix.side }}-evidence
          path: reports/control-matrix/
          if-no-files-found: ignore
          retention-days: 7
