name: Thornhaven Android test APK (maintained package)
on:
  workflow_dispatch:

# Compatibility entry point for old Android APK workflow bookmarks.
# Never run the historical Capacitor packaging path: it used a different
# applicationId, com.thornhaven.game, and cannot update existing player saves.
# Use the audited Gradle project, identity checks, and regression tests instead.
jobs:
  supported-android-build:
    uses: ./.github/workflows/thornhaven-android-build.yml
